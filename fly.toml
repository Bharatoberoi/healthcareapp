app = "medical-cost-rag"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  PRELOAD_FAISS = "true"
  UVICORN_WORKERS = "1"
  LOG_LEVEL = "INFO"
  LOG_FORMAT = "json"
  ENVIRONMENT = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

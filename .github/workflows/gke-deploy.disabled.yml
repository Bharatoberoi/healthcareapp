name: CI/CD — Build & Deploy to GKE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE: gcr.io/${{ secrets.GCP_PROJECT }}/service-code-resolution-api:${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true
      - name: Build and push Docker image
        run: |
          docker build -t $IMAGE .
          docker push $IMAGE

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location: ${{ secrets.GKE_ZONE }}
          project_id: ${{ secrets.GCP_PROJECT }}
      - name: Apply k8s manifests (update image) + install monitoring
        run: |
          kubectl set image deployment/service-code-resolution-api api=$IMAGE --record || true
          kubectl apply -f k8s/

          # Ensure helm is available, then install kube-prometheus-stack (Grafana + Prometheus Operator)
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts || true
          helm repo update
          helm upgrade --install prometheus prometheus-community/kube-prometheus-stack -n monitoring --create-namespace -f k8s/monitoring/values.yaml

          # Deploy Grafana dashboard ConfigMap so sidecar picks it up
          kubectl apply -f k8s/monitoring/grafana-dashboard-configmap.yaml

          kubectl rollout status deployment/service-code-resolution-api -n default --timeout=180s
      - name: Wait for LoadBalancer IP + smoke check
        run: |
          for i in $(seq 1 30); do \
            IP=$(kubectl get svc service-code-resolution-api -n default -o jsonpath='{.status.loadBalancer.ingress[0].ip}'); \
            if [ -n "$IP" ]; then echo "LB IP: $IP"; break; fi; \
            echo "Waiting for external IP..."; sleep 10; \
          done; \
          if [ -z "$IP" ]; then kubectl get svc service-code-resolution-api -n default -o yaml; exit 1; fi; \
          curl -fsS http://$IP/health

  load-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run k6 smoke load
        run: |
          IP=$(kubectl get svc service-code-resolution-api -n default -o jsonpath='{.status.loadBalancer.ingress[0].ip}');
          docker run --rm -i loadimpact/k6 run - < load-test/k6-script.js -e TARGET=http://$IP

# Required repo secrets:
# - GCP_PROJECT: GCP project id
# - GKE_CLUSTER: GKE cluster name
# - GKE_ZONE: cluster zone/region
# - GCP_SA_KEY: service account JSON with permissions to push images & update GKE

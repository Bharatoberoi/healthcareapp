# Deploy FastAPI (medical-cost-api) to Google Cloud Run on every push to main.
#
# Required repository SECRETS (Settings → Secrets and variables → Actions):
#   GCP_PROJECT        GCP project id (e.g. test1-493607) — or use GCP_PROJECT_ID instead
#   GCP_SA_KEY         JSON key for a service account that can:
#                      - push to Artifact Registry: REGION-docker.pkg.dev/PROJECT/cloud-run-source
#                      - deploy Cloud Run service (e.g. roles/run.admin + iam.serviceAccountUser on runtime SA)
#                      - create AR repo if missing: roles/artifactregistry.admin (or repo admin variant)
#   Enabling APIs (artifactregistry, run): either grant this SA roles/serviceusage.serviceUsageAdmin
#   on the project, OR enable APIs once as a project Owner (recommended in locked-down orgs).
#
# Billing: Artifact Registry and Cloud Run require an active billing account linked to the GCP project
# (BILLING_DISABLED will fail repo create / deploy until billing is enabled in Cloud Console).
#
# Required repository VARIABLES:
#   CLOUDSQL_CONNECTION   Cloud SQL connection name: PROJECT:REGION:INSTANCE
#
# Optional VARIABLES (defaults shown in "Set environment" step):
#   GCP_REGION, CLOUD_RUN_SERVICE, ARTIFACT_REPO, IMAGE_NAME,
#   OPENAI_SECRET_NAME, DATABASE_SECRET_NAME
#
# One-time GCP: Secret Manager secrets (e.g. openai-api-key, database-url), IAM on Cloud Run SA
# (secretAccessor + cloudsql.client). See scripts/deploy_cloud_run.ps1.

name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-cloud-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set environment
        id: env
        run: |
          PROJECT_ID="${{ secrets.GCP_PROJECT }}"
          [ -z "$PROJECT_ID" ] && PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          if [ -z "$PROJECT_ID" ]; then echo "Missing secret GCP_PROJECT or GCP_PROJECT_ID"; exit 1; fi
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then echo "Missing secret GCP_SA_KEY"; exit 1; fi
          if [ -z "${{ vars.CLOUDSQL_CONNECTION }}" ]; then echo "Missing variable CLOUDSQL_CONNECTION"; exit 1; fi
          REGION="${{ vars.GCP_REGION }}"
          [ -z "$REGION" ] && REGION="us-central1"
          SERVICE="${{ vars.CLOUD_RUN_SERVICE }}"
          [ -z "$SERVICE" ] && SERVICE="medical-cost-api"
          AR_REPO="${{ vars.ARTIFACT_REPO }}"
          [ -z "$AR_REPO" ] && AR_REPO="cloud-run-source"
          IMAGE_BASENAME="${{ vars.IMAGE_NAME }}"
          [ -z "$IMAGE_BASENAME" ] && IMAGE_BASENAME="medical-cost-api"
          OPENAI_SECRET="${{ vars.OPENAI_SECRET_NAME }}"
          [ -z "$OPENAI_SECRET" ] && OPENAI_SECRET="openai-api-key"
          DATABASE_SECRET="${{ vars.DATABASE_SECRET_NAME }}"
          [ -z "$DATABASE_SECRET" ] && DATABASE_SECRET="database-url"
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "REGION=$REGION" >> "$GITHUB_OUTPUT"
          echo "SERVICE=$SERVICE" >> "$GITHUB_OUTPUT"
          echo "AR_REPO=$AR_REPO" >> "$GITHUB_OUTPUT"
          echo "IMAGE_BASENAME=$IMAGE_BASENAME" >> "$GITHUB_OUTPUT"
          echo "OPENAI_SECRET=$OPENAI_SECRET" >> "$GITHUB_OUTPUT"
          echo "DATABASE_SECRET=$DATABASE_SECRET" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set gcloud project
        run: gcloud config set project "${{ steps.env.outputs.PROJECT_ID }}"

      # Fails with AUTH_PERMISSION_DENIED unless the SA has roles/serviceusage.serviceUsageAdmin
      # (or broader Editor/Owner). If your org only allows Owners to enable APIs, run once locally:
      #   gcloud services enable artifactregistry.googleapis.com run.googleapis.com --project=PROJECT_ID
      # continue-on-error: workflow still works when APIs are already enabled on the project.
      - name: Enable APIs (optional if SA has rights or APIs already on)
        continue-on-error: true
        run: |
          gcloud services enable artifactregistry.googleapis.com run.googleapis.com \
            --project "${{ steps.env.outputs.PROJECT_ID }}"

      - name: Ensure Artifact Registry Docker repository exists
        run: |
          REPO="${{ steps.env.outputs.AR_REPO }}"
          REGION="${{ steps.env.outputs.REGION }}"
          PROJECT="${{ steps.env.outputs.PROJECT_ID }}"
          if gcloud artifacts repositories describe "$REPO" --location="$REGION" --project="$PROJECT" 2>/dev/null; then
            echo "Repository $REPO already exists"
          else
            gcloud artifacts repositories create "$REPO" \
              --repository-format=docker \
              --location="$REGION" \
              --project="$PROJECT" \
              --description="Cloud Run container images"
          fi

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ steps.env.outputs.REGION }}-docker.pkg.dev" --quiet

      - name: Build and push image
        id: build_push
        run: |
          set -euxo pipefail
          REGISTRY="${{ steps.env.outputs.REGION }}-docker.pkg.dev/${{ steps.env.outputs.PROJECT_ID }}/${{ steps.env.outputs.AR_REPO }}"
          IMAGE="${REGISTRY}/${{ steps.env.outputs.IMAGE_BASENAME }}:${GITHUB_SHA}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Deploying image: $IMAGE"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ steps.env.outputs.SERVICE }}" \
            --project "${{ steps.env.outputs.PROJECT_ID }}" \
            --region "${{ steps.env.outputs.REGION }}" \
            --image "${{ steps.build_push.outputs.image }}" \
            --platform managed \
            --memory 4Gi \
            --cpu 2 \
            --min-instances 1 \
            --max-instances 5 \
            --timeout 300 \
            --concurrency 20 \
            --set-env-vars "PRELOAD_FAISS=true,LOG_LEVEL=INFO,ENVIRONMENT=production" \
            --add-cloudsql-instances "${{ vars.CLOUDSQL_CONNECTION }}" \
            --allow-unauthenticated \
            --set-secrets "OPENAI_API_KEY=${{ steps.env.outputs.OPENAI_SECRET }}:latest,DATABASE_URL=${{ steps.env.outputs.DATABASE_SECRET }}:latest"

      - name: Smoke test /health
        run: |
          URL=$(gcloud run services describe "${{ steps.env.outputs.SERVICE }}" \
            --project "${{ steps.env.outputs.PROJECT_ID }}" \
            --region "${{ steps.env.outputs.REGION }}" \
            --format 'value(status.url)')
          curl -fsS "${URL}/health"

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dash-service-code-slo
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  service-code-slo.json: |-
    {
      "annotations": {"list": []},
      "editable": true,
      "gnetId": null,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": "Prometheus",
          "fieldConfig": {"defaults": {}, "overrides": []},
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 0},
          "id": 1,
          "options": {},
          "targets": [
            {"expr": "histogram_quantile(0.95, sum(rate(http_response_time_seconds_bucket[5m])) by (le))", "legendFormat": "P95", "refId": "A"}
          ],
          "title": "P95 Request Latency (seconds)",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {"defaults": {}, "overrides": []},
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8},
          "id": 2,
          "options": {},
          "targets": [
            {"expr": "sum(rate(http_errors_total[5m])) / sum(rate(http_requests_total[5m]))", "legendFormat": "error_rate", "refId": "A"}
          ],
          "title": "Error Rate (5m)",
          "type": "timeseries"
        }
      ],
      "schemaVersion": 30,
      "style": "dark",
      "tags": ["slo"],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"},
      "timepicker": {},
      "timezone": "browser",
      "title": "Service Code Resolution — SLOs",
      "uid": "service-code-slo"
    }